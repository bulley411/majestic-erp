# Majestic APA ERP — Dokploy staging deployment
#
# Images are built in GitHub Actions and pulled here; the VPS has 2 cores
# shared with Dokploy and the existing staging site, so building on it
# would peg both for minutes on every deploy.
services:
  db:
    networks: [internal]
    expose: ["5432"]
    environment:
      TZ: UTC
      PGTZ: UTC
    # Tuned down from defaults, which assume a dedicated database server.
    command: >
      postgres
      -c shared_buffers=384MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=96MB
      -c max_connections=50
    deploy:
      resources:
        limits: { memory: 1G }

  redis:
    networks: [internal]
    expose: ["6379"]
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits: { memory: 256M }

  api:
    build: !reset null
    image: ghcr.io/bulley411/majestic-erp-api:latest
    networks: [internal, dokploy-network]
    expose: ["3000"]
    environment:
      NODE_ENV: production
      TZ: UTC
      UPLOAD_DIR: /app/uploads
      NODE_OPTIONS: "--max-old-space-size=768"
      CORS_ORIGIN: https://erp-staging.majesticpensionagent.com
    volumes:
      - uploads:/app/uploads
    deploy:
      resources:
        limits: { memory: 1G }
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.mapa-api-staging.rule=Host(`api-staging.majesticpensionagent.com`)"
      - "traefik.http.routers.mapa-api-staging.entrypoints=websecure"
      - "traefik.http.routers.mapa-api-staging.tls=true"
      - "traefik.http.routers.mapa-api-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.mapa-api-staging.loadbalancer.server.port=3000"
      # Document uploads are up to 10 MB; the default proxy limit is lower.
      - "traefik.http.routers.mapa-api-staging.middlewares=mapa-body-staging@docker"
      - "traefik.http.middlewares.mapa-body-staging.buffering.maxRequestBodyBytes=12000000"
      - "traefik.http.middlewares.mapa-body-staging.buffering.memRequestBodyBytes=2000000"

  web:
    build: !reset null
    image: ghcr.io/bulley411/majestic-erp-web:latest
    networks: [internal, dokploy-network]
    expose: ["80"]
    deploy:
      resources:
        limits: { memory: 128M }
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.mapa-web-staging.rule=Host(`erp-staging.majesticpensionagent.com`)"
      - "traefik.http.routers.mapa-web-staging.entrypoints=websecure"
      - "traefik.http.routers.mapa-web-staging.tls=true"
      - "traefik.http.routers.mapa-web-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.mapa-web-staging.loadbalancer.server.port=80"

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true