# Local development only. Docker Compose loads this automatically.
# Overrides the GHCR images with a local build.
services:
  db:
    ports: ["5432:5432"]

  redis:
    ports: ["6379:6379"]

  api:
    image: !reset null
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    ports: ["3000:3000"]
    networks: !reset [internal]

  web:
    image: !reset null
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    ports: ["5173:5173"]
    networks: !reset [internal]

networks:
  dokploy-network: !reset null